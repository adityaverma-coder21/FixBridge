<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FixBridge — Hostel Repair Companion</title>

  <style>
    /* =========================================================
       DESIGN TOKENS & RESET (Minimalist Light Theme)
    ========================================================== */
    :root {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --border: #E2E8F0;
      --border-strong: #CBD5E1;
      --text: #0F172A;
      --text-muted: #64748B;
      --accent: #2563EB;
      --accent-hover: #1D4ED8;
      --accent-soft: #EFF6FF;
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-pill: 999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    button, input, select {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================================================
       LAYOUT CONTAINER (Centered max-width: 680px)
    ========================================================== */
    .app-shell {
      max-width: 680px;
      margin: 0 auto;
      padding: 20px 16px 48px;
    }

    /* =========================================================
       COMPACT HEADER & TOP 3-TAB NAVIGATION
    ========================================================== */
    .app-header {
      margin-bottom: 16px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .brand-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .main-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      background: #E2E8F0;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 22px;
    }

    .main-tab-btn {
      border: none;
      background: transparent;
      padding: 10px 8px;
      border-radius: 9px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: background-color 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
    }

    .main-tab-btn:hover {
      color: var(--text);
    }

    .main-tab-btn.active {
      background: var(--surface);
      color: var(--accent);
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    }

    /* Tab Panels */
    .tab-panel {
      display: none;
      animation: fadeIn 0.18s ease-out;
    }

    .tab-panel.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* =========================================================
       SHARED UI PRIMITIVES (Cards, Inputs, Buttons)
    ========================================================== */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .input-field, .select-field {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      background: var(--surface);
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .input-field:focus, .select-field:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .input-field::placeholder {
      color: #94A3B8;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      text-align: center;
    }

    .btn-primary {
      background: var(--accent);
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border-color: var(--border-strong);
    }

    .btn-secondary:hover {
      background: #F1F5F9;
    }

    /* =========================================================
       TAB 1: NEARBY SHOPS
    ========================================================== */
    .search-wrap {
      position: relative;
      margin-bottom: 10px;
    }

    .search-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: #F1F5F9;
      color: var(--text-muted);
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-size: 0.9rem;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .search-clear.visible {
      display: inline-flex;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .chip {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: var(--radius-pill);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .chip:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .chip.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }

    /* Authorized / Unauthorized Switchable Toggle */
    .segmented-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #E2E8F0;
      padding: 3px;
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .toggle-btn {
      border: none;
      background: transparent;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .toggle-btn.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
    }

    .shop-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .shop-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .shop-title-group {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .rank-tag {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 2px 8px;
      border-radius: var(--radius-pill);
    }

    .shop-name {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
    }

    .shop-rating {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
    }

    .shop-rating span {
      color: #D97706;
      margin-right: 2px;
    }

    .shop-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .shop-specialty {
      font-size: 0.86rem;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }

    .shop-price {
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
    }

    .shop-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 4px;
    }

    /* =========================================================
       TAB 2: DIAGNOSE
    ========================================================== */
    .step-heading {
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 14px;
    }

    .device-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    @media (max-width: 480px) {
      .device-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .device-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 11px 8px;
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .device-btn:hover {
      border-color: var(--accent);
      color: var(--text);
    }

    .device-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .custom-issue-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .cause-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 16px;
    }

    .cause-box p {
      font-size: 0.92rem;
      color: var(--text);
    }

    .checklist {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .check-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .check-item:hover {
      background: var(--bg);
    }

    .check-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    .check-text {
      font-size: 0.9rem;
      color: var(--text);
    }

    .check-item.done .check-text {
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .tool-note {
      display: inline-block;
      margin-top: 4px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--accent);
    }

    .diag-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 440px) {
      .diag-actions {
        grid-template-columns: 1fr;
      }
    }

    /* =========================================================
       TAB 3: SELF REPAIR
    ========================================================== */
    .guide-header {
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .guide-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
    }

    .guide-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .guide-section {
      margin-bottom: 20px;
    }

    .guide-section:last-child {
      margin-bottom: 0;
    }

    .simple-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .simple-list li {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      font-size: 0.92rem;
      padding: 6px 0;
      border-bottom: 1px solid #F1F5F9;
    }

    .simple-list li:last-child {
      border-bottom: none;
    }

    .item-muted {
      font-size: 0.82rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .station-tag {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent);
      white-space: nowrap;
    }

    /* YouTube Recommendation Card */
    .yt-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg);
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .yt-card:hover {
      border-color: var(--accent);
      background: var(--surface);
    }

    .yt-icon {
      width: 48px;
      height: 34px;
      border-radius: 8px;
      background: #DC2626;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .yt-meta {
      min-width: 0;
    }

    .yt-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px;
    }

    .yt-channel {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Collapsible Step-by-Step Instructions */
    .collapsible-btn {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 11px 14px;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background-color 0.15s ease;
    }

    .collapsible-btn:hover {
      background: #F1F5F9;
    }

    .steps-ol {
      margin-top: 12px;
      padding-left: 20px;
      display: none;
      flex-direction: column;
      gap: 8px;
      font-size: 0.9rem;
      color: var(--text);
    }

    .steps-ol.open {
      display: flex;
    }

    .empty-state {
      text-align: center;
      padding: 28px 16px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <!-- =======================================================
         COMPACT HEADER
    ======================================================== -->
    <header class="app-header">
      <h1 class="brand-title">FixBridge</h1>
      <span class="brand-subtitle">Hostel Repair Companion</span>
    </header>

    <!-- =======================================================
         TOP 3 SWITCHABLE TABS
    ======================================================== -->
    <nav class="main-tabs" role="tablist" aria-label="Main Navigation">
      <button class="main-tab-btn active" id="tab-shops" role="tab" aria-selected="true" onclick="switchTab('shops')">
        Nearby Shops
      </button>
      <button class="main-tab-btn" id="tab-diagnose" role="tab" aria-selected="false" onclick="switchTab('diagnose')">
        Diagnose
      </button>
      <button class="main-tab-btn" id="tab-repair" role="tab" aria-selected="false" onclick="switchTab('repair')">
        Self Repair
      </button>
    </nav>

    <!-- =======================================================
         TAB 1: NEARBY SHOPS
    ======================================================== -->
    <section id="panel-shops" class="tab-panel active" role="tabpanel">
      <!-- Search Box -->
      <div class="search-wrap">
        <input
          type="text"
          id="shop-search"
          class="input-field"
          placeholder="Type your device or issue (e.g. laptop fan, phone screen, battery)..."
          oninput="handleShopSearch(this.value)"
        />
        <button id="shop-search-clear" class="search-clear" onclick="clearShopSearch()" aria-label="Clear search">×</button>
      </div>

      <!-- Minimal Quick-Fill Chips -->
      <div class="chip-row" id="quick-chips"></div>

      <!-- 2-Way Switchable Toggle: Authorized vs Unauthorized -->
      <div class="segmented-toggle" role="tablist" aria-label="Shop Type">
        <button id="toggle-authorized" class="toggle-btn active" onclick="setShopType('authorized')">
          Authorized
        </button>
        <button id="toggle-unauthorized" class="toggle-btn" onclick="setShopType('unauthorized')">
          Unauthorized
        </button>
      </div>

      <!-- Active Shop List -->
      <div id="shops-list" class="stack"></div>
    </section>

    <!-- =======================================================
         TAB 2: DIAGNOSE
    ======================================================== -->
    <section id="panel-diagnose" class="tab-panel" role="tabpanel">
      <div class="stack">
        <!-- Step 1: What's the problem? -->
        <div class="card">
          <h2 class="step-heading">1. What's the problem?</h2>

          <span class="label">Select Device</span>
          <div class="device-grid" id="device-buttons"></div>

          <label class="label" for="issue-select">Choose Common Issue</label>
          <select id="issue-select" class="select-field" onchange="selectIssue(this.value)"></select>

          <div class="custom-issue-row">
            <input
              type="text"
              id="custom-issue-input"
              class="input-field"
              placeholder="Or describe your issue..."
              onkeydown="if(event.key==='Enter') matchCustomIssue()"
            />
            <button class="btn btn-primary" onclick="matchCustomIssue()">Match</button>
          </div>
        </div>

        <!-- Step 2: How to check it -->
        <div id="diagnose-step-2" class="card" style="display: none;"></div>
      </div>
    </section>

    <!-- =======================================================
         TAB 3: SELF REPAIR
    ======================================================== -->
    <section id="panel-repair" class="tab-panel" role="tabpanel">
      <div class="stack">
        <!-- Guide Selector -->
        <div>
          <label class="label" for="repair-select">Select Repair Guide</label>
          <select id="repair-select" class="select-field" onchange="selectRepairGuide(this.value)"></select>
        </div>

        <!-- Single Clean Guide Card -->
        <div id="repair-card" class="card"></div>
      </div>
    </section>
  </div>

    /** Scores a shop by specialty & keyword match against the search query, plus star rating. */
    function scoreShop(shop, query) {
      const q = query.trim().toLowerCase();
      if (!q) return shop.rating;

      const tokens = q.split(/[\s,/\-]+/).filter((t) => t.length >= 2);
      let score = 0;

      if (shop.specialty.toLowerCase().includes(q)) score += 30;
      if (shop.name.toLowerCase().includes(q)) score += 20;

      tokens.forEach((token) => {
        if (shop.specialty.toLowerCase().includes(token)) score += 15;
        if (shop.name.toLowerCase().includes(token)) score += 10;
        shop.keywords.forEach((kw) => {
          if (kw.includes(token) || token.includes(kw)) score += 8;
        });
      });

      // Add star rating as tie-breaker
      return score + shop.rating;
    }

    function renderShops() {
      const listEl = document.getElementById('shops-list');
      const query = state.shopQuery.trim();

      // Filter strictly by the active Authorized / Unauthorized toggle
      const filtered = SHOPS
        .filter((s) => s.type === state.shopType)
        .map((s) => ({ ...s, score: scoreShop(s, query) }))
        .sort((a, b) => b.score - a.score || b.rating - a.rating);

      if (filtered.length === 0) {
        listEl.innerHTML = `<div class="empty-state">No shops found.</div>`;
        return;
      }

      listEl.innerHTML = filtered.map((shop, index) => {
        const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(shop.name + ' ' + shop.location)}`;
        const rankBadge = query ? `<span class="rank-tag">#${index + 1}</span>` : '';

        return `
          <article class="shop-card">
            <div class="shop-top">
              <div class="shop-title-group">
                ${rankBadge}
                <h3 class="shop-name">${shop.name}</h3>
              </div>
              <div class="shop-rating"><span>★</span>${shop.rating.toFixed(1)}</div>
            </div>

            <div class="shop-meta">${shop.location}</div>

            <div class="shop-specialty">
              <span>${shop.specialty}</span>
              <span class="shop-price">${shop.price}</span>
            </div>

            <div class="shop-actions">
              <a href="${mapsUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-primary">
                Directions
              </a>
              <a href="tel:${shop.phone}" class="btn btn-secondary">
                Call
              </a>
            </div>
          </article>
        `;
      }).join('');
    }

    /** Matches free-text user description to the closest diagnostic guide. */
    function matchCustomIssue() {
      const input = document.getElementById('custom-issue-input');
      const text = input.value.trim().toLowerCase();
      if (!text) return;

      let matchedDevice = state.selectedDevice;
      let matchedId = state.selectedIssueId;

      if (text.includes('fan') || text.includes('heat') || text.includes('hot')) {
        matchedDevice = 'Laptop'; matchedId = 'laptop-fan';
      } else if (text.includes('slow') || text.includes('ram') || text.includes('ssd') || text.includes('lag')) {
        matchedDevice = 'Laptop'; matchedId = 'laptop-slow';
      } else if (text.includes('screen') || text.includes('crack') || text.includes('touch') || text.includes('display')) {
        matchedDevice = 'Phone'; matchedId = 'phone-screen';
      } else if (text.includes('battery') || text.includes('drain') || text.includes('dead')) {
        matchedDevice = 'Phone'; matchedId = 'phone-battery';
      } else if (text.includes('earphone') || text.includes('headphone') || text.includes('jack') || text.includes('sound')) {
        matchedDevice = 'Earphones'; matchedId = 'earphone-jack';
      } else if (text.includes('charger') || text.includes('adapter') || text.includes('cable')) {
        matchedDevice = 'Charger'; matchedId = 'charger-dead';
      } else if (text.includes('port') || text.includes('loose') || text.includes('charging')) {
        matchedDevice = 'Phone'; matchedId = 'phone-port';
      }

      state.selectedDevice = matchedDevice;
      state.selectedIssueId = matchedId;
      state.checkedSteps = {};

      renderDeviceButtons();
      renderIssueDropdown();
      renderDiagnoseStep2();

      document.getElementById('diagnose-step-2').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
